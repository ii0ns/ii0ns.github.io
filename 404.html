<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Younes Sahraoui</title>
<!-- Served by GitHub Pages for any unknown path. The site is a single-page app,
     so the visitor is sent to the home view instead of a dead end. -->
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
    background: #0b1114; color: #cfdadd;
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.95rem; line-height: 1.6;
  }
  main { max-width: 34rem; }
  p { margin: 0 0 0.75rem; }
  .code { color: #5fd4c4; letter-spacing: 0.12em; }
  a { color: #5fd4c4; }
  a:focus-visible { outline: 2px solid #5fd4c4; outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <p>Cette page n'existe pas — le site a été réorganisé.</p>
  <p><a href="/#/">Retour à l'accueil</a></p>
  <p lang="en">This page does not exist — the site has been reorganised.
    <a href="/#/">Back to the homepage</a></p>
</main>
<script>
  if (location.pathname !== "/") location.replace("/#/");
</script>
</body>
</html>
