---
layout: default
---
<div class="progress" id="progress"></div>
<div class="wrap project-page">
  <article class="project-main">
    <a class="btn primary back-btn" href="{{ '/#projects' | relative_url }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>Back to projects</a>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%B %Y" }}{% if page.tags %} &middot; {{ page.tags | join: ", " }}{% endif %}</p>
    <div class="prose" id="prose">{{ content }}</div>
    <a class="btn back-btn" href="{{ '/#projects' | relative_url }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>Back to projects</a>
  </article>
  <nav class="toc" id="toc" aria-label="Chapters" hidden>
    <p class="toc-title">Chapters</p>
    <div class="toc-track"><span class="toc-bar" id="toc-bar"></span><ol id="toc-list"></ol></div>
  </nav>
</div>
<script>
(function(){
var hs=[].slice.call(document.querySelectorAll('#prose h2,#prose h3'));
var toc=document.getElementById('toc'),list=document.getElementById('toc-list'),bar=document.getElementById('toc-bar'),prog=document.getElementById('progress'),links=[];
if(hs.length>1){
  hs.forEach(function(h,i){
    if(!h.id)h.id='sec-'+i;
    var a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;
    if(h.tagName==='H3')a.className='sub';
    var li=document.createElement('li');li.appendChild(a);list.appendChild(li);links.push(a);
  });
  toc.hidden=false;
}
function update(){
  var st=window.scrollY,max=document.documentElement.scrollHeight-window.innerHeight;
  prog.style.width=(max>0?Math.min(100,st/max*100):0)+'%';
  if(!links.length)return;
  var cur=0;
  hs.forEach(function(h,i){if(h.getBoundingClientRect().top<140)cur=i});
  if(max>0&&st>=max-4)cur=links.length-1;
  links.forEach(function(a,i){a.classList.toggle('on',i===cur)});
  var li=links[cur].parentNode;
  bar.style.top=li.offsetTop+'px';bar.style.height=li.offsetHeight+'px';
}
var busy=false;
window.addEventListener('scroll',function(){if(!busy){busy=true;requestAnimationFrame(function(){update();busy=false})}},{passive:true});
window.addEventListener('resize',update);
update();
})();
</script>
