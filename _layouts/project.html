---
layout: default
---
<article class="wrap narrow project-page">
  <a class="back" href="{{ '/#projects' | relative_url }}">Back to projects</a>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %Y" }}{% if page.tags %} &middot; {{ page.tags | join: ", " }}{% endif %}</p>
  <div class="prose">{{ content }}</div>
</article>
