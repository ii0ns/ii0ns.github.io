<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirection — Projets</title>
<!-- Legacy URL from the old Jekyll site. This project is not on the static site
     yet, so the visitor lands on the Projects section instead of a 404.
     Point this at ../../#/projects/<slug> once the project page exists. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="../../#projects">
<meta http-equiv="refresh" content="0; url=../../#projects">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
         background: #0b1114; color: #cfdadd;
         font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
         font-size: 0.95rem; line-height: 1.6; }
  main { max-width: 34rem; }
  p { margin: 0 0 0.75rem; }
  a { color: #5fd4c4; }
</style>
</head>
<body>
<main>
  <p>Cette page a été déplacée. <a href="../../#projects">Voir les projets</a></p>
  <p lang="en">This page has moved. <a href="../../#projects">See the projects</a></p>
</main>
<script>location.replace(new URL("../../", location.href).href + "#projects");</script>
</body>
</html>
